name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Frontend quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify formatting, lint, and types
        run: npm run verify

      - name: Run unit tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Build Docker image
        run: docker build --build-arg VITE_API_BASE_URL="${{ vars.VITE_API_BASE_URL || 'http://localhost:5000' }}" -t researchtrack-web:${{ github.sha }} .

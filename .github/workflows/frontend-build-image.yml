name: Frontend Build Image

on:
  workflow_call:
    inputs:
      environment_name:
        description: GitHub Environment that owns the frontend build configuration
        required: true
        type: string
      image_tag:
        description: Mutable deployment tag, for example test or production
        required: true
        type: string
    outputs:
      image_ref:
        description: Fully-qualified image reference for the deployment tag
        value: ${{ jobs.build.outputs.image_ref }}
      sha_image_ref:
        description: Fully-qualified immutable short-SHA image reference
        value: ${{ jobs.build.outputs.sha_image_ref }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and Push Image
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment_name }}
    outputs:
      image_ref: ${{ steps.meta.outputs.image_ref }}
      sha_image_ref: ${{ steps.meta.outputs.sha_image_ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate build configuration
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          set -euo pipefail

          if [ -z "${VITE_API_BASE_URL:-}" ]; then
            echo "VITE_API_BASE_URL is not configured for environment '${{ inputs.environment_name }}'." >&2
            exit 1
          fi

          case "$VITE_API_BASE_URL" in
            http://*|https://*) ;;
            *)
              echo "VITE_API_BASE_URL must start with http:// or https://" >&2
              exit 1
              ;;
          esac

      - name: Derive image metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_REPO="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE_REF="${IMAGE_REPO}:${{ inputs.image_tag }}"
          SHA_IMAGE_REF="${IMAGE_REPO}:${SHORT_SHA}"

          echo "image_repo=$IMAGE_REPO" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "image_ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"
          echo "sha_image_ref=$SHA_IMAGE_REF" >> "$GITHUB_OUTPUT"

          echo "Building deployment image: $IMAGE_REF"
          echo "Immutable image tag: $SHA_IMAGE_REF"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image_ref }}
            ${{ steps.meta.outputs.sha_image_ref }}
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
          cache-from: type=gha,scope=researchtrack-frontend
          cache-to: type=gha,scope=researchtrack-frontend,mode=max

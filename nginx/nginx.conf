server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Runtime compression for text-based frontend assets.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/manifest+json
        image/svg+xml;

    # Lightweight container health endpoint used by Docker and CI/CD.
    location = /health {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "healthy\n";
    }

    # Vite emits fingerprinted files under /assets, so they can be cached
    # aggressively. A changed asset receives a new filename.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # index.html must be revalidated so deployments are discovered quickly.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # React/Vite SPA fallback. Real files are served directly; application
    # routes such as /projects/123 fall back to index.html for React Router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Safe baseline response headers that do not constrain application APIs.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
